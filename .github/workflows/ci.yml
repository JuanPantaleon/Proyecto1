name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run lint (affected)
        run: npx nx affected -t lint --parallel=3
      - name: Run typecheck (affected)
        run: npx nx affected -t typecheck --parallel=3

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ranked_fitness_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: nrwl/nx-set-shas@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma Client
        run: npx nx run backend:prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/ranked_fitness_test?schema=public
      - name: Run backend tests
        run: npx nx run backend:test --coverage
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/ranked_fitness_test?schema=public
          JWT_SECRET: test-secret
          CLERK_SECRET_KEY: sk_test_test
          CLERK_PUBLISHABLE_KEY: pk_test_test

  test-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nrwl/nx-set-shas@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run shared tests
        run: npx nx run shared:test

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-backend, test-shared]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build affected
        run: npx nx affected -t build --parallel=3
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7